<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omega</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      background: #04112a;
    }

    .scroll-scene {
      height: 320vh;
      height: 320svh;
    }

    .scene {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #04112a;
    }

    .layer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      user-select: none;
      will-change: transform, opacity;
    }

    .end-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: none;
      z-index: 20;
      pointer-events: none;
      user-select: none;
    }

    body.loading { overflow: hidden; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #050508;
      font-family: Arial, sans-serif;
      transition: opacity .8s ease, visibility .8s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: #e5a93c;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      color: #aaa;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .scroll-indicator {
      position: fixed;
      left: 50%;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 0;
      background: none;
      color: #ddd;
      font-family: Arial, sans-serif;
      cursor: pointer;
      opacity: .8;
      transform: translateX(-50%);
      transition: opacity .3s ease, visibility .3s ease;
    }

    .scroll-indicator:hover { opacity: 1; }

    .scroll-indicator.hidden,
    body.loading .scroll-indicator {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .scroll-indicator .text {
      font-size: 11px;
      letter-spacing: 3px;
    }

    .scroll-indicator .arrow {
      width: 16px;
      height: 16px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: rotate(45deg) translate(0, 0); }
      40% { transform: rotate(45deg) translate(5px, 5px); }
      60% { transform: rotate(45deg) translate(2px, 2px); }
    }

    .contact-fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border: 1px solid rgba(229, 169, 60, .55);
      border-radius: 999px;
      background: rgba(4, 17, 42, .82);
      color: #e5a93c;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .3s ease, color .3s ease, opacity .3s ease, visibility .3s ease;
    }

    .contact-fab:hover { background: #e5a93c; color: #04112a; }

    body.loading .contact-fab { opacity: 0; visibility: hidden; }

    .contact-dialog {
      width: min(560px, 92vw);
      padding: 24px 28px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      background: #071a35;
      color: #e8ecf4;
      font-family: Arial, sans-serif;
    }

    .contact-dialog::backdrop {
      background: rgba(2, 8, 20, .72);
      backdrop-filter: blur(4px);
    }

    .dialog-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .dialog-kicker { font-size: 11px; letter-spacing: 3px; color: #e5a93c; }

    .dialog-close {
      border: 0;
      background: none;
      color: #aaa;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .dialog-close:hover { color: #fff; }

    .contact-dialog h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
    }

    .dialog-intro {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.7;
      color: #9fb0c9;
    }

    .contact-dialog label {
      display: block;
      margin-bottom: 12px;
      font-size: 13px;
      color: #cdd7e6;
    }

    .contact-dialog label > span { color: #e5a93c; }

    .contact-dialog input,
    .contact-dialog textarea {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
      color: #f2f5fa;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .contact-dialog input:focus,
    .contact-dialog textarea:focus {
      outline: none;
      border-color: #e5a93c;
    }

    .otp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -4px 0 12px;
    }

    .otp-row input {
      margin-top: 0;
      flex: 0 0 140px;
    }

    .otp-btn {
      padding: 9px 14px;
      border: 1px solid rgba(229, 169, 60, .55);
      border-radius: 8px;
      background: transparent;
      color: #e5a93c;
      font-size: 12px;
      letter-spacing: 1px;
      white-space: nowrap;
      cursor: pointer;
    }

    .otp-btn:hover:not(:disabled) { background: rgba(229, 169, 60, .15); }
    .otp-btn:disabled { opacity: .4; cursor: default; }

    .otp-state { font-size: 12px; color: #9fb0c9; }
    .otp-state.ok { color: #7fd88f; }

    .form-privacy {
      margin: 4px 0 12px;
      font-size: 11px;
      line-height: 1.7;
      color: #8296b0;
    }

    #contact-verification { margin-bottom: 8px; }

    #form-status {
      min-height: 18px;
      margin: 10px 0;
      font-size: 13px;
      line-height: 1.7;
      color: #e8cf9a;
    }

    .form-submit {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #e5a93c;
      color: #04112a;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .form-submit:disabled { opacity: .35; cursor: default; }
  </style>
</head>
<body class="loading">
  <div id="loader" role="status" aria-label="Loading Assets">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-text">Loading Assets...</div>
  </div>

  <main class="scroll-scene" id="scroll-scene">
    <div class="scene" id="scene" role="img" aria-label="Omega 山景主視覺動畫"></div>
  </main>

  <button class="scroll-indicator" id="scroll-indicator" type="button">
    <span class="text">SCROLL DOWN</span>
    <span class="arrow" aria-hidden="true"></span>
  </button>

  <button class="contact-fab" id="contact-fab" type="button">
    連絡我們 <span aria-hidden="true">↗</span>
  </button>

  <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-dialog-title">
    <div class="dialog-top">
      <span class="dialog-kicker">CONTACT OMEGA</span>
      <button class="dialog-close" id="dialog-close" type="button" aria-label="關閉視窗">×</button>
    </div>
    <h2 id="contact-dialog-title">聯絡我們</h2>
    <p class="dialog-intro">填寫資料並完成 Email 與手機驗證後，訊息會寄送給我們，同時寄一份收件通知到您的信箱。</p>
    <form id="contact-form">
      <label>您的稱呼 <span aria-hidden="true">*</span>
        <input name="name" type="text" autocomplete="name" placeholder="怎麼稱呼您？" required maxlength="50">
      </label>
      <label>電子郵件 <span aria-hidden="true">*</span>
        <input name="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="100">
      </label>
      <div class="otp-row">
        <input id="email-otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Email 驗證碼" maxlength="6" aria-label="Email 驗證碼">
        <button class="otp-btn" id="send-email-otp" type="button">發送驗證碼</button>
        <button class="otp-btn" id="verify-email-otp" type="button" disabled>驗證</button>
        <span class="otp-state" id="email-otp-state"></span>
      </div>
      <label>聯絡電話（台灣手機）<span aria-hidden="true">*</span>
        <input name="phone" type="tel" autocomplete="tel" placeholder="0912-345-678" required maxlength="30">
      </label>
      <div class="otp-row">
        <input id="phone-otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="簡訊驗證碼" maxlength="6" aria-label="簡訊驗證碼">
        <button class="otp-btn" id="send-phone-otp" type="button">發送驗證碼</button>
        <button class="otp-btn" id="verify-phone-otp" type="button" disabled>驗證</button>
        <span class="otp-state" id="phone-otp-state"></span>
      </div>
      <label>想告訴我們的事（選填）
        <textarea name="message" rows="3" placeholder="請簡述您的需求…" maxlength="500"></textarea>
      </label>
      <p class="form-privacy">以上資料經 Email 與簡訊驗證後，將透過 Cloudflare 郵件服務寄送給我們，僅用於本次聯絡；請勿填寫敏感資訊。</p>
      <div id="contact-verification" aria-label="安全驗證"></div>
      <p id="form-status" role="status" aria-live="polite" tabindex="-1"></p>
      <button class="form-submit" id="contact-submit" type="submit" disabled>送出訊息</button>
    </form>
  </dialog>

  <script src="night/night_parameter.js"></script>
  <script>
    (() => {
      const scene = document.getElementById("scene");
      const scrollScene = document.getElementById("scroll-scene");
      const loader = document.getElementById("loader");
      const scrollIndicator = document.getElementById("scroll-indicator");

      // 點擊向下按鈕滑動
      scrollIndicator.addEventListener("click", () => {
        const start = scrollScene.getBoundingClientRect().top + window.scrollY;
        const distance = scene.offsetHeight * 2;
        window.scrollTo({ top: start + distance / 2, behavior: "smooth" });
      });

      // 圖層順序 (z-index 由低至高 1 ~ 8)
      const parameters = [
        milkway,
        blue,
        moving_red,
        light_clouds,
        sun,
        black_mountain,
        red_mountain,
        omega
      ];

      // 特殊檔案名稱映射
      const filenames = {
        "3light_clouds.png": "3lighting_cloud.png"
      };

      // 初始化動態圖層元素
      const layers = parameters.map((parameter, index) => {
        const image = document.createElement("img");
        image.className = "layer";
        image.src = `night/${filenames[parameter.filename] ?? parameter.filename}`;
        image.alt = "";
        image.setAttribute("aria-hidden", "true");
        image.draggable = false;
        image.style.zIndex = index + 1;
        scene.appendChild(image);
        return image;
      });

      // 備用靜態降級圖層 (用於超高螢幕比例)
      const endFallback = document.createElement("img");
      endFallback.className = "end-fallback";
      endFallback.src = "night/end.png";
      endFallback.alt = "";
      endFallback.setAttribute("aria-hidden", "true");
      endFallback.draggable = false;
      scene.appendChild(endFallback);

      // 動畫數值插值輔助函式
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const smoothstep = value => value * value * (3 - 2 * value);
      const interpolate = (from, to, amount) => from + (to - from) * amount;

      // 根據滾動進度計算關鍵幀屬性 (start -> mid -> end)
      function keyframeValue(parameter, property, progress) {
        const firstHalf = progress <= 0.5;
        const from = parameter[`${firstHalf ? "start" : "mid"}_${property}`];
        const to = parameter[`${firstHalf ? "mid" : "end"}_${property}`];
        const amount = smoothstep(firstHalf ? progress * 2 : (progress - 0.5) * 2);
        return interpolate(from, to, amount);
      }

      let scheduled = false;

      // 核心渲染函式
      function render() {
        scheduled = false;

        const viewportWidth = scene.clientWidth;
        const viewportHeight = scene.clientHeight;

        // 當螢幕長寬比例高於 milkway 的長寬比例 (height / width > 3414 / 1920)，
        // 導致 milkway 寬度縮放時無法蓋住螢幕高度時：切換為 100vh 靜態降級模式 (顯示 end.png + 置中 omega)
        const isTooTall = (viewportHeight / viewportWidth) > (milkway.height / milkway.width);

        if (isTooTall) {
          endFallback.style.display = "block";
          scrollScene.style.height = "100vh";
          scrollIndicator.classList.add("hidden");

          // 隱藏 0~6 圖層，顯示第 7 個圖層 (omega) 並在 end.png 上方按 Contain 模式居中擺放
          layers.forEach((img, idx) => {
            if (idx === 7) {
              const scale = Math.min(
                viewportWidth / omega.width,
                viewportHeight / omega.height
              );
              const renderWidth = omega.width * scale;
              const renderHeight = omega.height * scale;
              const left = (viewportWidth - renderWidth) / 2;
              const top = (viewportHeight - renderHeight) / 2;

              img.style.width = `${renderWidth}px`;
              img.style.height = `${renderHeight}px`;
              img.style.opacity = "1";
              img.style.transform = `translate3d(${left}px, ${top}px, 0)`;
              img.style.zIndex = "25";
              img.style.display = "block";
            } else {
              img.style.display = "none";
            }
          });
          return;
        }

        // 恢復正常互動式滾輪動畫模式
        endFallback.style.display = "none";
        scrollScene.style.height = "320vh";
        layers.forEach((img, idx) => {
          img.style.display = "block";
          img.style.zIndex = idx + 1;
        });

        const distance = scene.offsetHeight * 2;
        const progress = distance > 0
          ? clamp(-scrollScene.getBoundingClientRect().top / distance, 0, 1)
          : 0;

        scrollIndicator.classList.toggle("hidden", progress > 0.03);

        // 計算 black_mountain 上下緣邊界 (作為 milkway 對齊基準)
        const bmScale = Math.max(
          viewportWidth / black_mountain.width,
          viewportHeight / black_mountain.height
        );
        const bmRenderHeight = black_mountain.height * bmScale;
        const bmTop = (viewportHeight - bmRenderHeight) / 2;
        const bmBottom = bmTop + bmRenderHeight;

        // 計算各圖層位置與樣式
        parameters.forEach((parameter, index) => {
          const alpha = keyframeValue(parameter, "alpha", progress);
          const shift = keyframeValue(parameter, "shift_y_percent", progress);

          let renderWidth, renderHeight, left, translateY;

          if (parameter === milkway) {
            // milkway 寬度等同螢幕寬度，保持比例計算高度
            renderWidth = viewportWidth;
            renderHeight = viewportWidth * (milkway.height / milkway.width);
            left = 0;

            // start 時下緣與 black_mountain 下緣對齊，mid/end 時上緣與 black_mountain 上緣對齊
            const mwTopStart = bmBottom - renderHeight;
            const mwTopMid = bmTop;

            const firstHalf = progress <= 0.5;
            const amount = smoothstep(firstHalf ? progress * 2 : (progress - 0.5) * 2);
            translateY = firstHalf
              ? interpolate(mwTopStart, mwTopMid, amount)
              : mwTopMid;
          } else if (parameter === omega) {
            // omega 強制長寬比例固定不得縮放變形，填滿寬或填滿長，長寬均不被裁切 (contain 模式)，水平與垂直置中
            const scale = Math.min(
              viewportWidth / parameter.width,
              viewportHeight / parameter.height
            );
            renderWidth = parameter.width * scale;
            renderHeight = parameter.height * scale;
            left = (viewportWidth - renderWidth) / 2;
            translateY = (viewportHeight - renderHeight) / 2 + shift * viewportHeight;
          } else {
            // 計算自適應縮放，保持圖片原長寬比例並 Cover 填滿螢幕
            const scale = Math.max(
              viewportWidth / parameter.width,
              viewportHeight / parameter.height
            );
            renderWidth = parameter.width * scale;
            renderHeight = parameter.height * scale;
            left = (viewportWidth - renderWidth) / 2;
            translateY = shift * viewportHeight;
          }

          layers[index].style.width = `${renderWidth}px`;
          layers[index].style.height = `${renderHeight}px`;
          layers[index].style.opacity = alpha;
          layers[index].style.transform = `translate3d(${left}px, ${translateY}px, 0)`;
        });
      }

      function scheduleRender() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(render);
      }

      // 事件監聽與觸發
      window.addEventListener("scroll", scheduleRender, { passive: true });
      window.addEventListener("resize", scheduleRender);
      render();

      // 素材解碼預載，完成後隱藏 Loading 畫面
      Promise.all(
        [...scene.querySelectorAll("img")].map(image => image.decode().catch(() => {}))
      ).then(() => {
        loader.classList.add("hidden");
        document.body.classList.remove("loading");
        scheduleRender();
      });
    })();
  </script>
  <script>
    (() => {
      const WORKER_BASE = "https://client-to-store-mail.kmbt1og.workers.dev";
      const TURNSTILE_SITEKEY = "0x4AAAAAAFdg9Uj1_ZsI_w97";

      const dialog = document.getElementById("contact-dialog");
      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");
      const submit = document.getElementById("contact-submit");
      const nameInput = form.elements.name;
      const emailInput = form.elements.email;
      const phoneInput = form.elements.phone;
      const messageInput = form.elements.message;

      function normalizeEmail(value) {
        const target = String(value || "").trim().toLowerCase();
        return /^[^\s<>@,;|]+@[^\s<>@,;|]+\.[^\s<>@,;|]+$/.test(target) ? target : null;
      }

      function normalizePhone(value) {
        const clean = String(value || "").replace(/[\s\-().]/g, "");
        if (/^09\d{8}$/.test(clean)) return `+886${clean.slice(1)}`;
        if (/^8869\d{8}$/.test(clean)) return `+${clean}`;
        if (/^\+8869\d{8}$/.test(clean)) return clean;
        return null;
      }

      const channels = {
        email: {
          sendBtn: document.getElementById("send-email-otp"),
          verifyBtn: document.getElementById("verify-email-otp"),
          codeInput: document.getElementById("email-otp-code"),
          state: document.getElementById("email-otp-state"),
          targetInput: emailInput,
          normalize: normalizeEmail,
          badTargetMsg: "請輸入有效的 Email",
          sentMsg: "驗證碼已寄到您的 Email",
        },
        sms: {
          sendBtn: document.getElementById("send-phone-otp"),
          verifyBtn: document.getElementById("verify-phone-otp"),
          codeInput: document.getElementById("phone-otp-code"),
          state: document.getElementById("phone-otp-state"),
          targetInput: phoneInput,
          normalize: normalizePhone,
          badTargetMsg: "請輸入有效台灣手機（09 開頭共 10 碼）",
          sentMsg: "驗證碼已發送至您的手機",
        },
      };

      let verificationToken = "";
      let widgetId;
      let verificationLoading = false;
      let sending = false;
      let sent = false;
      const proofs = { email: "", sms: "" };
      const verifiedTargets = { email: "", sms: "" };

      function updateSubmit() {
        submit.disabled = sending || sent
          || !nameInput.value.trim()
          || !verifiedTargets.email || !verifiedTargets.sms
          || !verificationToken;
      }

      function clearVerification() {
        verificationToken = "";
        updateSubmit();
      }

      function resetVerification() {
        clearVerification();
        if (widgetId !== undefined && window.turnstile) window.turnstile.reset(widgetId);
      }

      function loadVerification() {
        if (widgetId !== undefined || !TURNSTILE_SITEKEY || TURNSTILE_SITEKEY.startsWith("PENDING")) return;
        if (window.turnstile) {
          widgetId = window.turnstile.render("#contact-verification", {
            sitekey: TURNSTILE_SITEKEY,
            action: "omega_contact",
            size: "flexible",
            callback: (token) => {
              verificationToken = token;
              updateSubmit();
            },
            "expired-callback": resetVerification,
            "error-callback": () => {
              if (sent) return;
              clearVerification();
              status.textContent = "安全驗證無法載入，請重新開啟視窗。";
            },
          });
          return;
        }
        if (verificationLoading) return;
        verificationLoading = true;
        const script = document.createElement("script");
        script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
        script.async = true;
        script.onload = () => {
          verificationLoading = false;
          loadVerification();
        };
        script.onerror = () => {
          verificationLoading = false;
          status.textContent = "安全驗證無法載入，請重新開啟視窗。";
        };
        document.head.append(script);
      }

      function startCountdown(c, seconds) {
        clearTimeout(c._timer);
        let left = seconds;
        const tick = () => {
          if (left <= 0) {
            c.sendBtn.textContent = "重新發送";
            c.sendBtn.disabled = false;
            return;
          }
          c.sendBtn.textContent = `重新發送（${left}）`;
          left -= 1;
          c._timer = setTimeout(tick, 1000);
        };
        tick();
      }

      async function postJson(path, payload) {
        const res = await fetch(`${WORKER_BASE}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout(30000),
        });
        let result = {};
        try { result = await res.json(); } catch { /* 保留預設錯誤訊息 */ }
        return { res, result };
      }

      async function sendOtp(channel) {
        const c = channels[channel];
        const target = c.normalize(c.targetInput.value);
        if (!target) {
          c.state.textContent = c.badTargetMsg;
          c.targetInput.focus();
          return;
        }
        if (!verificationToken) {
          status.textContent = "安全驗證尚未完成，請稍候再試。";
          return;
        }
        c.sendBtn.disabled = true;
        c.state.classList.remove("ok");
        c.state.textContent = "發送中…";
        try {
          const { res, result } = await postJson("/otp/send", {
            site: "omega", channel, target, turnstileToken: verificationToken,
          });
          if (!res.ok || result.sent !== true) throw new Error(result.error || "驗證碼發送失敗");
          c.state.textContent = c.sentMsg;
          c.verifyBtn.disabled = false;
          startCountdown(c, result.resendAfter || 60);
        } catch (error) {
          c.state.textContent = "";
          c.sendBtn.disabled = false;
          status.textContent = error instanceof TypeError || error.name === "TimeoutError"
            ? "網路連線異常，請稍後再試。" : error.message;
        } finally {
          resetVerification();
        }
      }

      async function verifyOtp(channel) {
        const c = channels[channel];
        const target = c.normalize(c.targetInput.value);
        const code = c.codeInput.value.trim();
        if (!target) {
          c.state.textContent = c.badTargetMsg;
          return;
        }
        if (!/^\d{6}$/.test(code)) {
          c.state.textContent = "請輸入 6 位數驗證碼";
          return;
        }
        c.verifyBtn.disabled = true;
        c.state.classList.remove("ok");
        c.state.textContent = "驗證中…";
        try {
          const { res, result } = await postJson("/otp/verify", { site: "omega", channel, target, code });
          if (!res.ok || result.verified !== true || typeof result.proof !== "string") {
            throw new Error(result.error || "驗證失敗");
          }
          proofs[channel] = result.proof;
          verifiedTargets[channel] = target;
          c.state.textContent = "✓ 已驗證";
          c.state.classList.add("ok");
          c.codeInput.disabled = true;
          status.textContent = "";
        } catch (error) {
          c.state.textContent = error instanceof TypeError || error.name === "TimeoutError"
            ? "網路連線異常，請稍後再試。" : error.message;
          c.verifyBtn.disabled = false;
        }
        updateSubmit();
      }

      Object.entries(channels).forEach(([key, c]) => {
        c.targetInput.addEventListener("input", () => {
          proofs[key] = "";
          verifiedTargets[key] = "";
          c.state.textContent = "";
          c.state.classList.remove("ok");
          c.codeInput.disabled = false;
          c.codeInput.value = "";
          c.verifyBtn.disabled = true;
          updateSubmit();
        });
        c.sendBtn.addEventListener("click", () => sendOtp(key));
        c.verifyBtn.addEventListener("click", () => verifyOtp(key));
      });
      nameInput.addEventListener("input", updateSubmit);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (sending || sent || !form.reportValidity()) return;
        if (!verifiedTargets.email || !verifiedTargets.sms) {
          status.textContent = "請先完成 Email 與手機驗證。";
          return;
        }
        if (!verificationToken) {
          status.textContent = "安全驗證尚未完成，請稍候。";
          return;
        }
        const payload = {
          site: "omega",
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          phone: phoneInput.value.trim(),
          message: messageInput.value.trim(),
          emailProof: proofs.email,
          phoneProof: proofs.sms,
          turnstileToken: verificationToken,
        };
        sending = true;
        updateSubmit();
        form.setAttribute("aria-busy", "true");
        status.textContent = "正在送出，請勿重複提交……";
        try {
          const { res, result } = await postJson("/contact", payload);
          if (!res.ok || result.accepted !== true) throw new Error(result.error || "送出失敗，請稍後再試。");
          sent = true;
          form.style.display = "none";
          dialog.querySelector(".dialog-intro").hidden = true;
          document.getElementById("contact-dialog-title").textContent = "信件已送出";
          const emailNotice = result.customerEmailSent === true
            ? "收件通知已寄至您的 Email（寄件者 no-reply@omegaai.cc），若未收到請檢查垃圾郵件匣。"
            : "您的 Email 通知未能確認寄出，但我們已收到需求。";
          status.textContent = `需求已寄送給我們，請勿重複提交。${emailNotice}`;
          form.reset();
          status.focus();
        } catch (error) {
          status.textContent = error instanceof TypeError || error.name === "TimeoutError"
            ? "無法確認寄送結果，請勿立即重送；請來信 e@otm.tw 確認。"
            : error.message;
        } finally {
          sending = false;
          form.removeAttribute("aria-busy");
          if (!sent) resetVerification();
          updateSubmit();
        }
      });

      document.getElementById("contact-fab").addEventListener("click", () => {
        dialog.showModal();
        loadVerification();
        if (!TURNSTILE_SITEKEY || TURNSTILE_SITEKEY.startsWith("PENDING")) {
          status.textContent = "安全驗證尚未設定完成，暫無法送出。";
        }
      });
      document.getElementById("dialog-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    })();
  </script>
</body>
</html>
